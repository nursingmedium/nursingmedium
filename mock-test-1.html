<style>
:root{--b:#095CF8;--ink:#14213D;--bg:#F4F7FB;--line:#DCE3EF;--ok:#14804A;--bad:#D12F2F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#095CF8,#07399F);color:#fff;padding:16px}
.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}
.timer{font-size:20px;font-weight:900;background:#ffffff20;padding:9px 14px;border-radius:10px}
main{max-width:1200px;margin:22px auto;padding:0 15px;display:grid;grid-template-columns:1fr 310px;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px #14213d0c}
.question,.result{padding:25px}
.num{font-size:12px;color:var(--b);font-weight:900;margin-bottom:9px}
.q{font-size:19px;line-height:1.55;font-weight:800;margin-bottom:20px}
.opt{display:flex;gap:11px;border:1px solid var(--line);padding:14px;border-radius:12px;margin:9px 0;cursor:pointer}
.opt:hover{background:#f7faff;border-color:#8eb2ff}.opt input{margin-top:4px}.letter{font-weight:900;color:var(--b)}
.actions{display:flex;justify-content:space-between;margin-top:22px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}
.primary{background:var(--b);color:#fff}.secondary{background:#edf2f8;color:var(--ink)}
.nav{padding:18px;position:sticky;top:88px;height:max-content}.nav h3{font-size:15px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.qn{padding:8px 0;background:#fff;border:1px solid var(--line);font-size:12px}
.qn.done{background:#dff4e8;border-color:#9bd6b7}.qn.current{outline:2px solid var(--b)}
.submit{width:100%;margin-top:17px;background:#111827;color:#fff}
.score{font-size:42px;font-weight:900;color:var(--b)}
.rev{border-top:1px solid var(--line);padding:16px 0;line-height:1.5}
.good{color:var(--ok);font-weight:800}.wrong{color:var(--bad);font-weight:800}
@media(max-width:850px){
main{grid-template-columns:1fr}.nav{position:static;order:-1}
.grid{grid-template-columns:repeat(10,1fr)}.q{font-size:17px}
}
</style>

sulin shifts potassium intracellularly. With severe hypokalemia, potassium replacement is required before insulin."}, {"id": 5, "q": "A patient with acute pulmonary edema has SpO2 78%, BP 210/118 mmHg, and diffuse crackles. What should be prioritized?", "opts": ["Noninvasive positive-pressure ventilation with treatment of the hypertensive emergency", "Supine positioning and increased maintenance fluids", "A rapid large-volume IV fluid bolus", "Encouraging oral fluids"], "ans": 0, "rat": "Severe cardiogenic pulmonary edema requires rapid oxygenation/ventilatory support and reduction of preload/afterload."}, {"id": 6, "q": "A patient with SIADH has sodium 116 mEq/L and a generalized seizure. Which treatment is most appropriate?", "opts": ["Carefully administered hypertonic saline with close sodium monitoring", "Hypotonic saline", "Unrestricted oral water", "Desmopressin"], "ans": 0, "rat": "Severe symptomatic hyponatremia is treated with carefully controlled hypertonic saline."}, {"id": 7, "q": "A patient with AKI has potassium 7.1 mEq/L, peaked T waves, and QRS widening. Which medication first stabilizes the myocardium?", "opts": ["IV calcium gluconate", "IV regular insulin alone", "Nebulized salbutamol alone", "Oral potassium binder"], "ans": 0, "rat": "IV calcium rapidly stabilizes the cardiac membrane but does not itself remove potassium."}, {"id": 8, "q": "A patient receiving magnesium sulfate for severe preeclampsia develops RR 8/min, absent patellar reflexes, and oliguria. What should the nurse do?", "opts": ["Stop magnesium sulfate and prepare calcium gluconate", "Increase the magnesium infusion", "Administer oxytocin", "Place the patient in Trendelenburg"], "ans": 0, "rat": "Respiratory depression and absent reflexes indicate magnesium toxicity."}, {"id": 9, "q": "A COPD patient receiving oxygen becomes increasingly somnolent with a respiratory rate of 8/min. Which finding is most concerning?", "opts": ["Increasing somnolence with severe bradypnea", "SpO2 improving from 84% to 90%", "Reduced accessory muscle use", "Reduced anxiety"], "ans": 0, "rat": "New somnolence and bradypnea suggest worsening hypercapnic respiratory failure."}, {"id": 10, "q": "After thyroidectomy, a patient develops perioral tingling and carpopedal spasm. Which abnormality is most likely?", "opts": ["Decreased ionized calcium", "Decreased sodium", "Increased magnesium", "Increased potassium"], "ans": 0, "rat": "Post-thyroidectomy hypocalcemia can occur from parathyroid injury and causes neuromuscular irritability."}, {"id": 11, "q": "A patient receiving IV amiodarone develops new hypotension and marked bradycardia. What is the priority?", "opts": ["Reassess immediately and notify the prescriber/adjust therapy as indicated", "Give the next dose faster", "Encourage ambulation", "Ignore it as an expected therapeutic effect"], "ans": 0, "rat": "IV amiodarone can produce significant hypotension and bradycardia."}, {"id": 12, "q": "A patient with suspected bacterial meningitis arrives in the ED. Which action is appropriate?", "opts": ["Implement droplet precautions and facilitate prompt antimicrobial treatment", "Use airborne isolation only", "Delay antibiotics until all imaging is completed", "Encourage ambulation"], "ans": 0, "rat": "Bacterial meningitis requires appropriate isolation and rapid antimicrobial treatment without harmful diagnostic delay."}, {"id": 13, "q": "A patient receiving vancomycin develops flushing and pruritus during a rapid infusion. What is most likely?", "opts": ["Vancomycin infusion reaction related to rapid administration", "Acute hemolytic reaction", "Serotonin syndrome", "Anticholinergic toxicity"], "ans": 0, "rat": "Rapid vancomycin administration can cause histamine-mediated infusion reactions."}, {"id": 14, "q": "A patient with acute ischemic stroke is being considered for thrombolysis. Which finding is a definitive concern?", "opts": ["Intracranial hemorrhage on brain imaging", "Glucose 118 mg/dL", "Symptoms began 60 minutes ago", "BP 168/94 mmHg"], "ans": 0, "rat": "Intracranial hemorrhage is a contraindication to thrombolytic therapy."}, {"id": 15, "q": "A patient with myasthenia gravis develops progressive dysphagia and shallow respirations after infection. What most strongly supports myasthenic crisis?", "opts": ["Progressive respiratory muscle weakness with reduced vital capacity", "Pinpoint pupils and salivation", "Severe rigidity and hyperreflexia", "Improvement after withholding all therapy"], "ans": 0, "rat": "Myasthenic crisis is characterized by worsening bulbar and respiratory muscle weakness."}, {"id": 16, "q": "A patient with Parkinson disease is NPO after aspiration. Which medication-related action is most important?", "opts": ["Avoid unnecessary interruption of scheduled antiparkinsonian therapy", "Hold all antiparkinsonian drugs until oral intake resumes", "Give levodopa only when tremor is severe", "Replace missed doses with opioids"], "ans": 0, "rat": "Abrupt interruption of dopaminergic therapy can cause severe rigidity and systemic complications."}, {"id": 17, "q": "A patient with cirrhosis has hematemesis, BP 82/50 mmHg, and tachycardia. Which drug is commonly initiated early for suspected variceal bleeding?", "opts": ["IV octreotide", "IV morphine", "Insulin glargine", "Lactulose as sole emergency therapy"], "ans": 0, "rat": "Octreotide reduces splanchnic blood flow and portal pressure and is used early in variceal hemorrhage."}, {"id": 18, "q": "A patient receiving digoxin has nausea, yellow-green visual changes, and an apical pulse of 48/min. What should the nurse do?", "opts": ["Hold digoxin and assess serum digoxin level, potassium, and renal function", "Administer the next dose with food", "Give potassium without checking the level", "Encourage vigorous exercise"], "ans": 0, "rat": "These are classic warning signs of possible digoxin toxicity."}, {"id": 19, "q": "A patient develops fever, chills, flank pain, and hypotension 15 minutes after a blood transfusion starts. What is first?", "opts": ["Stop the transfusion immediately and maintain IV access with normal saline using new tubing", "Slow the transfusion and reassess later", "Flush the tubing with dextrose", "Discard the blood bag before notifying anyone"], "ans": 0, "rat": "These findings suggest an acute transfusion reaction. Stop the blood first and follow the reaction protocol."}, {"id": 20, "q": "A patient with inferior STEMI becomes profoundly hypotensive after nitroglycerin. Which complication should be suspected?", "opts": ["Right ventricular infarction with preload dependence", "Acute left ventricular failure from excess preload", "Simple pericarditis", "Aortic stenosis"], "ans": 0, "rat": "Right ventricular infarction is preload dependent and nitrates can cause severe hypotension."}, {"id": 21, "q": "A patient with acute pancreatitis has severe epigastric pain radiating to the back. Which laboratory finding is most expected?", "opts": ["Markedly elevated serum lipase", "Markedly decreased lipase", "Severe isolated unconjugated hyperbilirubinemia in every case", "Low calcium is required for diagnosis"], "ans": 0, "rat": "Serum lipase is typically elevated in acute pancreatitis."}, {"id": 22, "q": "A patient with Addisonian crisis has BP 76/42, sodium 124, potassium 6.2, and glucose 52 mg/dL. What is most urgent?", "opts": ["Rapid isotonic fluid, IV glucocorticoid, and correction of hypoglycemia", "Fluid restriction", "Loop diuretic monotherapy", "Insulin without glucose"], "ans": 0, "rat": "Adrenal crisis causes hypotension, electrolyte abnormalities, and hypoglycemia requiring immediate treatment."}, {"id": 23, "q": "A patient with pheochromocytoma is prepared for surgery. Which sequence is correct?", "opts": ["Alpha blockade before beta blockade", "Beta blockade before alpha blockade", "Diuretic before alpha blockade", "Calcium before beta blockade"], "ans": 0, "rat": "Alpha blockade must precede beta blockade to avoid unopposed alpha-mediated vasoconstriction."}, {"id": 24, "q": "A patient with acute liver failure has confusion and asterixis. Which treatment reduces intestinal ammonia absorption?", "opts": ["Lactulose titrated to regular soft stools", "Permanent severe protein restriction", "IV iron", "Loop diuretics"], "ans": 0, "rat": "Lactulose traps ammonia as ammonium in the colon and increases fecal nitrogen elimination."}, {"id": 25, "q": "A patient with Guillain-Barré syndrome has rapidly progressive weakness. Which assessment is highest priority?", "opts": ["Serial forced vital capacity and respiratory muscle strength", "Daily visual acuity", "Bowel sounds only", "Skin turgor only"], "ans": 0, "rat": "Respiratory muscle paralysis can develop rapidly in Guillain-Barré syndrome."}, {"id": 26, "q": "A patient with tibial fracture has escalating pain despite opioids and pain on passive toe movement. What is the priority?", "opts": ["Immediate surgical evaluation for compartment decompression", "Elevate the limb far above the heart and apply ice continuously", "Apply a tighter compression dressing", "Encourage weight-bearing"], "ans": 0, "rat": "Pain out of proportion and pain with passive stretch are red flags for compartment syndrome."}, {"id": 27, "q": "A patient suddenly becomes dyspneic and hypotensive with suspected PE. Which finding directly supports the diagnosis?", "opts": ["CT pulmonary angiography showing a pulmonary arterial filling defect", "Normal D-dimer despite high clinical suspicion", "Mild hyperinflation on chest X-ray", "Normal ECG alone"], "ans": 0, "rat": "A pulmonary arterial filling defect on CT angiography directly supports PE."}, {"id": 28, "q": "A patient with a mechanical heart valve takes warfarin. Which laboratory test monitors therapy?", "opts": ["INR", "aPTT", "Bleeding time", "Fibrinogen alone"], "ans": 0, "rat": "Warfarin is monitored using PT expressed as INR."}, {"id": 29, "q": "A patient taking sertraline receives linezolid and develops agitation, diaphoresis, hyperreflexia, and clonus. What is most likely?", "opts": ["Serotonin syndrome", "Neuroleptic malignant syndrome", "Malignant hyperthermia", "Anticholinergic syndrome"], "ans": 0, "rat": "Linezolid has MAOI activity; clonus and hyperreflexia strongly support serotonin syndrome."}, {"id": 30, "q": "A patient taking lithium develops coarse tremor, diarrhea, ataxia, and confusion. What should the nurse do?", "opts": ["Hold lithium and urgently assess serum level, renal function, and hydration", "Give the next dose with extra salt restriction", "Give an NSAID to increase clearance", "Encourage dehydration"], "ans": 0, "rat": "These findings suggest lithium toxicity, which is strongly influenced by renal function and hydration."}, {"id": 31, "q": "A patient remains in status epilepticus after adequate benzodiazepine therapy. Which is appropriate next-line treatment?", "opts": ["IV levetiracetam or fosphenytoin according to protocol", "Oral carbamazepine only", "Subcutaneous insulin", "IM haloperidol"], "ans": 0, "rat": "Established status epilepticus generally requires a second-line IV antiseizure drug after benzodiazepines."}, {"id": 32, "q": "A patient with severe asthma has a silent chest, exhaustion, and rising PaCO2. What does this suggest?", "opts": ["Impending respiratory muscle fatigue and ventilatory failure", "Definite improvement", "Metabolic alkalosis", "Resolution of bronchospasm"], "ans": 0, "rat": "A normalizing or rising PaCO2 in severe asthma can indicate respiratory muscle fatigue."}, {"id": 33, "q": "Which ventilator strategy is most consistent with lung-protective ventilation for ARDS?", "opts": ["Low tidal volume based on predicted body weight with appropriate PEEP", "High tidal volume based on actual body weight", "Zero PEEP", "Routine extreme hyperventilation"], "ans": 0, "rat": "ARDS ventilation uses low tidal volume based on predicted body weight and appropriate PEEP."}, {"id": 34, "q": "Immediately after central venous catheter insertion, a patient develops dyspnea, hypotension, and unilateral absent breath sounds. What is most likely?", "opts": ["Iatrogenic tension pneumothorax", "Pulmonary edema", "Pericarditis", "Hypoalbuminemic pleural effusion"], "ans": 0, "rat": "Sudden respiratory compromise after central line placement strongly suggests pneumothorax; tension physiology is an emergency."}, {"id": 35, "q": "A patient with infective endocarditis develops sudden focal neurologic deficit. Which complication should be considered?", "opts": ["Embolic ischemic stroke from valvular vegetation", "Migraine", "Peripheral neuropathy", "Hypoglycemia only"], "ans": 0, "rat": "Endocarditis vegetations can embolize and cause ischemic stroke."}, {"id": 36, "q": "Why are patients with nephrotic syndrome at increased risk for venous thrombosis?", "opts": ["Urinary loss of anticoagulant proteins creates a hypercoagulable state", "They always have severe dehydration", "They have universal thrombocytopenia", "They develop respiratory alkalosis"], "ans": 0, "rat": "Urinary loss of antithrombin and other anticoagulant proteins contributes to hypercoagulability."}, {"id": 37, "q": "A patient with severe hypocalcemia has prolonged QT and ventricular ectopy. What is appropriate?", "opts": ["IV calcium replacement with continuous cardiac monitoring", "IV bicarbonate alone", "Rapid potassium infusion regardless of level", "Fluid restriction"], "ans": 0, "rat": "Symptomatic severe hypocalcemia with ECG abnormalities requires IV calcium and monitoring."}, {"id": 38, "q": "A patient has pH 7.20, HCO3 12 mEq/L, and PaCO2 25 mmHg. What is the best interpretation?", "opts": ["Primary metabolic acidosis with respiratory compensation", "Primary respiratory acidosis", "Primary metabolic alkalosis", "Uncompensated respiratory alkalosis"], "ans": 0, "rat": "Low bicarbonate indicates metabolic acidosis; low PaCO2 reflects respiratory compensation."}, {"id": 39, "q": "A patient with acute stroke has dysphagia. What should occur before oral intake?", "opts": ["Validated swallow assessment", "Thin liquids as a test", "Food placed on the affected side", "Rapid drinking through a straw"], "ans": 0, "rat": "Stroke-related dysphagia can cause silent aspiration; swallowing safety must be assessed first."}, {"id": 40, "q": "A tracheostomy patient becomes distressed and the suction catheter cannot pass. What is the priority?", "opts": ["Suspect obstruction/displacement and initiate emergency airway management", "Increase tube feeding", "Wait after cuff deflation", "Place the patient flat"], "ans": 0, "rat": "Inability to pass a suction catheter with acute distress suggests obstruction or displacement."}, {"id": 41, "q": "A patient receiving hypertonic saline for severe hyponatremia has sodium rise by 10 mEq/L in 6 hours. What is concerning?", "opts": ["Overly rapid correction and risk of osmotic demyelination", "Expected correction with no concern", "Worsening SIADH", "Acute hyperkalemia"], "ans": 0, "rat": "Rapid correction of chronic hyponatremia can cause osmotic demyelination."}, {"id": 42, "q": "A patient with suspected acute aortic dissection has tearing chest pain and unequal arm pressures. What medication strategy is prioritized?", "opts": ["IV beta blockade to reduce aortic shear stress", "Immediate thrombolysis", "Immediate anticoagulation before imaging", "Exercise"], "ans": 0, "rat": "Initial medical therapy reduces heart rate and aortic shear stress, commonly with IV beta blockade."}, {"id": 43, "q": "A patient with severe mitral stenosis develops atrial fibrillation and pulmonary edema. Why can AF worsen symptoms?", "opts": ["Loss of atrial contraction impairs LV filling across the stenotic valve", "Atrial contraction becomes stronger", "Diastole becomes longer", "Pulmonary venous pressure always falls"], "ans": 0, "rat": "Atrial contraction contributes to ventricular filling across a stenotic mitral valve; AF can worsen congestion."}, {"id": 44, "q": "A postoperative patient develops confusion, tachycardia, hypotension, abdominal distension, and falling hemoglobin. What is the priority concern?", "opts": ["Occult intra-abdominal hemorrhage with hemorrhagic shock", "Expected postoperative pain", "Mild atelectasis", "Routine anemia"], "ans": 0, "rat": "The combination strongly suggests internal bleeding and requires urgent escalation."}, {"id": 45, "q": "A patient on heparin has markedly prolonged aPTT and active bleeding. What is the appropriate initial action?", "opts": ["Stop heparin and follow the anticoagulation-reversal protocol", "Increase heparin", "Give aspirin", "Encourage ambulation"], "ans": 0, "rat": "Active bleeding with excessive anticoagulation requires stopping heparin and appropriate reversal/management."}, {"id": 46, "q": "An unconscious patient with type 1 diabetes has glucose 38 mg/dL and no IV access. What is appropriate?", "opts": ["IM glucagon while emergency vascular access is obtained", "Oral glucose", "Long-acting insulin", "Carbohydrate restriction"], "ans": 0, "rat": "Unconscious patients should not receive oral intake. Glucagon is appropriate when IV access is unavailable."}, {"id": 47, "q": "A patient taking clozapine develops fever, sore throat, and profound neutropenia. What is the priority?", "opts": ["Withhold clozapine and urgently evaluate for agranulocytosis/infection", "Continue clozapine", "Increase clozapine", "Give only an anticholinergic"], "ans": 0, "rat": "Clozapine can cause severe neutropenia/agranulocytosis requiring urgent evaluation."}, {"id": 48, "q": "A patient taking haloperidol develops high fever, severe rigidity, autonomic instability, and altered consciousness. What is most likely?", "opts": ["Neuroleptic malignant syndrome", "Serotonin syndrome", "Malignant hyperthermia", "Acute dystonia"], "ans": 0, "rat": "NMS is characterized by hyperthermia, severe rigidity, autonomic instability, and altered mental status."}, {"id": 49, "q": "A patient develops sudden aphasia and unilateral weakness while receiving heparin. What should the nurse do first?", "opts": ["Activate the acute stroke response and establish exact symptom-onset time", "Give more heparin", "Wait for the next routine assessment", "Give oral food"], "ans": 0, "rat": "Stroke treatment is highly time dependent; rapid assessment and onset-time documentation are essential."}, {"id": 50, "q": "A pregnant patient with severe hypertension has RUQ pain, headache, visual symptoms, platelets 72,000/mm3, and markedly elevated AST. What is most likely?", "opts": ["HELLP syndrome", "Placenta previa", "Gestational diabetes", "Hyperemesis gravidarum"], "ans": 0, "rat": "HELLP is characterized by hemolysis, elevated liver enzymes, and low platelets and is a severe pregnancy complication."}, {"id": 51, "q": "A pregnant patient has painless bright-red third-trimester bleeding and a soft, nontender uterus. What is most likely?", "opts": ["Placenta previa", "Placental abruption", "Uterine rupture", "Hyperemesis"], "ans": 0, "rat": "Painless bright-red third-trimester bleeding with a nontender uterus is classic for placenta previa."}, {"id": 52, "q": "A postpartum patient has heavy bleeding and a boggy enlarged uterus. What is the priority?", "opts": ["Uterine massage and immediate postpartum-hemorrhage management", "Continuous abdominal pressure without assessment", "Ambulation", "Waiting for hemoglobin"], "ans": 0, "rat": "Uterine atony is the most common cause of postpartum hemorrhage; fundal massage and rapid escalation are priorities."}, {"id": 53, "q": "A newborn remains apneic after drying, warming, positioning, and stimulation; HR is 80/min. What is next?", "opts": ["Positive-pressure ventilation", "Chest compressions immediately", "Oral glucose", "Routine deep suctioning"], "ans": 0, "rat": "Apnea or HR below 100/min after initial steps requires positive-pressure ventilation."}, {"id": 54, "q": "A child with Tetralogy of Fallot develops a hypercyanotic spell. Which position is best?", "opts": ["Knee-chest", "Supine with legs extended", "Prone with head below heart", "High Fowler with legs dangling"], "ans": 0, "rat": "Knee-chest positioning increases systemic vascular resistance and reduces right-to-left shunting."}, {"id": 55, "q": "A child with epiglottitis has drooling, muffled voice, fever, and tripod positioning. Which action is unsafe?", "opts": ["Attempting to inspect the throat with a tongue depressor", "Keeping the child calm", "Preparing for controlled airway management", "Providing oxygen as tolerated"], "ans": 0, "rat": "Throat manipulation can precipitate complete airway obstruction in epiglottitis."}, {"id": 56, "q": "A child with nephrotic syndrome develops sudden abdominal pain, fever, and guarding. Which complication is concerning?", "opts": ["Spontaneous bacterial peritonitis", "Constipation", "Simple renal stone", "Otitis media"], "ans": 0, "rat": "Nephrotic syndrome increases infection risk because of urinary loss of immunoglobulins and complement."}, {"id": 57, "q": "A child with DKA on insulin develops potassium 2.8 mEq/L. What is the priority?", "opts": ["Urgent potassium replacement and reassessment of insulin therapy", "Increase insulin rate", "Restrict potassium", "Give oral water only"], "ans": 0, "rat": "Insulin can worsen hypokalemia; severe hypokalemia requires urgent correction."}, {"id": 58, "q": "A patient with tuberculosis is taking rifampicin. Which teaching is correct?", "opts": ["Orange-red discoloration of urine, tears, and other body fluids can occur", "The drug must be stopped if urine turns orange", "It has no drug interactions", "It routinely causes severe hypoglycemia"], "ans": 0, "rat": "Rifampicin commonly causes orange-red discoloration and has important drug interactions."}, {"id": 59, "q": "A patient with suspected C. difficile infection requires which infection-control approach?", "opts": ["Contact precautions and soap-and-water hand hygiene", "Alcohol hand rub alone", "Airborne precautions only", "Standard precautions without enhance , "Use a no-suicide contract and leave the patient alone", "Change the subject"], "ans": 0, "rat": "A specific imminent suicide plan represents high risk and requires immediate safety measures and emergency psychiatric assessment."}, {"id": 96, "q": "A patient with septic shock has received norepinephrine through a peripheral IV. The site becomes pale, cool, and painful. What complication should be suspected?", "opts": ["Extravasation with local vasoconstriction", "Expected therapeutic response", "Fluid overload at the IV site", "Hypoglycemia"], "ans": 0, "rat": "Norepinephrine extravasation can cause severe local ischemia and requires immediate protocol-based management."}, {"id": 97, "q": "A patient with acute kidney injury has metabolic acidosis and refractory hyperkalemia despite medical therapy. Which finding most strongly supports urgent renal replacement therapy?", "opts": ["Persistent life-threatening hyperkalemia despite appropriate medical treatment", "Creatinine elevation alone", "Mild peripheral edema", "BUN elevation without symptoms"], "ans": 0, "rat": "Refractory life-threatening electrolyte or acid-base abnormalities are major indications for urgent dialysis."}, {"id": 98, "q": "A patient with a new ileostomy has output of 2.5 L/day and dizziness on standing. Which problem is most likely?", "opts": ["High-output stoma causing volume and electrolyte depletion", "Normal mature ileostomy function", "Acute pulmonary edema", "SIADH"], "ans": 0, "rat": "High ileostomy output can cause significant fluid and sodium losses and orthostatic symptoms."}, {"id": 99, "q": "A patient with a femoral fracture suddenly develops hypoxemia, confusion, and a petechial rash on the upper chest. What is most likely?", "opts": ["Fat embolism syndrome", "Massive hemothorax", "Tension pneumothorax", "Acute bacterial pneumonia"], "ans": 0, "rat": "The classic triad includes respiratory distress, neurologic changes, and petechiae after long-bone fracture."}, {"id": 100, "q": "A patient with cirrhosis develops tense ascites, fever, abdominal pain, and worsening renal function. Which diagnostic procedure is most important?", "opts": ["Diagnostic paracentesis", "Routine upper GI endoscopy first", "Bronchoscopy", "Bone marrow biopsy"], "ans": 0, "rat": "New or worsening ascites with fever requires prompt paracentesis to evaluate for spontaneous bacterial peritonitis."}];

let currentQuestion = 0;
let answers = Array(data.length).fill(null);
let submitted = false;
let remaining = 90 * 60;
let clock = null;

const L = ['A', 'B', 'C', 'D'];

function safe(value) {
  return String(value).replace(/[&<>"]/g, m => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;'
  }[m]));
}

function render() {
  if (submitted) return;

  const d = data[currentQuestion];

  document.getElementById('question').innerHTML =
    '<div class="num">QUESTION ' +
    (currentQuestion + 1) + ' OF ' + data.length + '</div>' +

    '<div class="q">' + safe(d.q) + '</div>' +

    d.opts.map((option, j) =>
      '<label class="opt">' +
      '<input type="radio" name="answer" value="' + j + '" ' +
      (answers[currentQuestion] === j ? 'checked' : '') +
      ' onchange="selectAnswer(' + j + ')">' +
      '<span class="letter">' + L[j] + '.</span>' +
      '<span>' + safe(option) + '</span>' +
      '</label>'
    ).join('') +

    '<div class="actions">' +
    '<button type="button" class="secondary" ' +
    'onclick="goToPreviousQuestion()">← Previous</button>' +

    '<button type="button" class="primary" ' +
    'onclick="goToNextQuestion()">Next →</button>' +
    '</div>';

  renderNavigator();
}

function selectAnswer(optionIndex) {
  if (submitted) return;
  answers[currentQuestion] = optionIndex;
  renderNavigator();
}

function renderNavigator() {
  if (submitted) return;

  document.getElementById('nav').innerHTML =
    data.map((d, index) => {
      const answered =
        answers[index] !== null ? 'done ' : '';

      const active =
        index === currentQuestion ? 'current' : '';

      return '<button type="button" class="qn ' +
        answered + active +
        '" onclick="goToQuestion(' + index + ')">' +
        (index + 1) +
        '</button>';
    }).join('');
}

function goToQuestion(index) {
  if (submitted) return;

  if (index >= 0 && index < data.length) {
    currentQuestion = index;
    render();
  }
}

function goToNextQuestion() {
  if (submitted) return;

  if (currentQuestion < data.length - 1) {
    currentQuestion++;
    render();
  } else {
    submitTest(false);
  }
}

function goToPreviousQuestion() {
  if (submitted) return;

  if (currentQuestion > 0) {
    currentQuestion--;
    render();
  }
}

function submitTest(autoSubmit = false) {
  if (submitted) return;

  if (!autoSubmit) {
    const unanswered =
      answers.filter(answer => answer === null).length;

    const message = unanswered > 0
      ? 'You have ' + unanswered +
        ' unanswered questions. Submit test?'
      : 'Submit the test now?';

    if (!window.confirm(message)) return;
  }

  submitted = true;

  if (clock !== null) {
    clearInterval(clock);
    clock = null;
  }

  const score = answers.reduce(
    (total, answer, index) =>
      total + (answer === data[index].ans ? 1 : 0),
    0
  );

  showResult(score);
}

function showResult(score) {
  const attempted =
    answers.filter(answer => answer !== null).length;

  const incorrect = attempted - score;
  const skipped = data.length - attempted;

  let html =
    '<section>' +
    '<div class="card result">' +
    '<div class="num">MOCK TEST 1 RESULT</div>' +
    '<div class="score">' +
    score + ' / ' + data.length +
    '</div>' +

    '<p><b>Correct:</b> ' + score +
    ' | <b>Incorrect:</b> ' + incorrect +
    ' | <b>Skipped:</b> ' + skipped +
    '</p>' +

    '<button type="button" class="primary" ' +
    'onclick="location.reload()">Retake Test</button>' +
    '</div>' +

    '<div class="card result">' +
    '<h2>Answer Review & Rationales</h2>';

  data.forEach((d, index) => {
    const selected = answers[index];
    const correct = selected === d.ans;

    html +=
      '<div class="rev">' +
      '<b>Q' + (index + 1) + '. ' +
      safe(d.q) + '</b>' +

      '<p class="' +
      (correct ? 'good' : 'wrong') + '">' +

      (selected === null
        ? 'Skipped'
        : 'Your Answer: ' +
          L[selected] + '. ' +
          safe(d.opts[selected])) +
      '</p>' +

      '<p><b>Correct Answer:</b> ' +
      L[d.ans] + '. ' +
      safe(d.opts[d.ans]) + '</p>' +

      '<p><b>Rationale:</b> ' +
      safe(d.rat) + '</p>' +
      '</div>';
  });

  html += '</div></section>';

  document.getElementById('app').innerHTML = html;
}

function updateTimer() {
  const minutes = Math.floor(remaining / 60);
  const seconds = remaining % 60;

  document.getElementById('timer').textContent =
    String(minutes).padStart(2, '0') + ':' +
    String(seconds).padStart(2, '0');
}

function startTimer() {
  updateTimer();

  clock = setInterval(() => {
    if (submitted) return;

    remaining = Math.max(0, remaining - 1);
    updateTimer();

    if (remaining === 0) {
      submitTest(true);
    }
  }, 1000);
}

startTimer();
render();

</script>
