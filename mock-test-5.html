const TOTAL=raw.length;
const qs=raw.map((r,i)=>({
 id:i+1,
 topic:r[0],
 stem:r[1],
 options:r.slice(2,6),
 correct:r[6],
 rationale:r[7]
}));

let current=0;
let answers=Array(TOTAL).fill(null);
let marked=Array(TOTAL).fill(false);
let secondsLeft=90*60;
let finished=false;
let timer=null;
const deadline=Date.now()+90*60*1000;

const E=id=>document.getElementById(id);

function render(){
 const q=qs[current];
 E("topic").textContent=q.topic;
 E("qnum").textContent="Question "+(current+1)+" of "+TOTAL;
 E("bar").style.width=((current+1)/TOTAL*100)+"%";

 const body=E("questionBody");
 body.replaceChildren();

 const stem=document.createElement("div");
 stem.className="stem";
 stem.textContent=q.stem;
 body.appendChild(stem);

 q.options.forEach((option,i)=>{
  const label=document.createElement("label");
  label.className="opt"+(answers[current]===i?" sel":"");

  const input=document.createElement("input");
  input.type="radio";
  input.name="answer";
  input.checked=answers[current]===i;
  input.onchange=()=>pick(i);

  const letter=document.createElement("b");
  letter.textContent=String.fromCharCode(65+i)+".";

  const text=document.createElement("span");
  text.textContent=option;

  label.append(input,letter,text);
  body.appendChild(label);
 });

 const navigator=E("navigator");
 navigator.replaceChildren();

 qs.forEach((q,i)=>{
  const button=document.createElement("button");
  button.type="button";
  button.textContent=i+1;
  button.className="jump"+
   (answers[i]!==null?" done":"")+
   (marked[i]?" marked":"")+
   (i===current?" cur":"");
  button.onclick=()=>go(i);
  navigator.appendChild(button);
 });

 const answered=answers.filter(x=>x!==null).length;
 const reviewCount=marked.filter(Boolean).length;

 E("counts").textContent=
  "Answered: "+answered+"/"+TOTAL+
  " | Unanswered: "+(TOTAL-answered)+
  " | Marked: "+reviewCount;

 E("markBtn").textContent=
  marked[current]?"★ Remove Review Mark":"☆ Mark for Review";
}

function pick(i){
 if(finished)return;
 answers[current]=i;
 render();
}

function go(i){
 if(finished)return;
 if(i<0||i>=TOTAL)return;
 current=i;
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}

function next(){go(current+1)}
function prev(){go(current-1)}

function toggleMark(){
 if(finished)return;
 marked[current]=!marked[current];
 render();
}

function clearAnswer(){
 if(finished)return;
 answers[current]=null;
 render();
}

function updateTimer(){
 const m=Math.floor(secondsLeft/60);
 const s=secondsLeft%60;
 E("timer").textContent=
  String(m).padStart(2,"0")+":"+
  String(s).padStart(2,"0");

 if(secondsLeft<=300){
  E("timer").style.background="#b91c1c";
 }
}

function submitTest(auto){
 if(finished)return;

 const unanswered=answers.filter(x=>x===null).length;

 if(!auto){
  const message=
   "Submit Mock Test 5?\n\n"+
   "Answered: "+(TOTAL-unanswered)+"\n"+
   "Unanswered: "+unanswered+"\n\n"+
   "You cannot change answers after submission.";

  if(!confirm(message))return;
 }

 finished=true;
 clearInterval(timer);

 const correct=qs.reduce(
  (sum,q,i)=>sum+(answers[i]===q.correct?1:0),0
 );

 const incorrect=TOTAL-correct-unanswered;

 E("exam").style.display="none";
 E("result").style.display="block";
 E("score").textContent=correct+"/"+TOTAL;

 E("summary").textContent=
  "Correct: "+correct+
  " | Incorrect: "+incorrect+
  " | Unanswered: "+unanswered+
  " | Percentage: "+Math.round(correct/TOTAL*100)+"%"+
  (auto?" | Time completed":"");

 const stats={};

 qs.forEach((q,i)=>{
  if(!stats[q.topic]){
   stats[q.topic]={correct:0,total:0};
  }
  stats[q.topic].total++;
  if(answers[i]===q.correct){
   stats[q.topic].correct++;
  }
 });

 const topics=E("topics");
 topics.replaceChildren();

 Object.entries(stats).forEach(([topic,stat])=>{
  const div=document.createElement("div");
  div.className="topicrow";
  div.textContent=
   topic+": "+stat.correct+"/"+stat.total+
   " ("+Math.round(stat.correct/stat.total*100)+"%)";
  topics.appendChild(div);
 });

 const reviews=E("reviews");
 reviews.replaceChildren();

 qs.forEach((q,i)=>{
  const box=document.createElement("div");
  box.className="review";

  const heading=document.createElement("strong");
  heading.textContent=
   "Q"+(i+1)+" — "+q.topic+": "+q.stem;

  const status=document.createElement("p");
  const isCorrect=answers[i]===q.correct;
  status.className=isCorrect?"ok":"bad";
  status.textContent=
   isCorrect?"✓ Correct":"✗ Incorrect / Unanswered";

  const selected=document.createElement("p");
  selected.textContent=
   "Your Answer: "+
   (answers[i]===null
    ?"Not Answered"
    :String.fromCharCode(65+answers[i])+
     ". "+q.options[answers[i]]);

  const correctAnswer=document.createElement("p");
  correctAnswer.textContent=
   "Correct Answer: "+
   String.fromCharCode(65+q.correct)+
   ". "+q.options[q.correct];

  const rationale=document.createElement("p");
  rationale.textContent="Rationale: "+q.rationale;

  box.append(
   heading,status,selected,correctAnswer,rationale
  );
  reviews.appendChild(box);
 });

 window.scrollTo(0,0);
}

function startExam(){
updateTimer();
render();

timer=setInterval(()=>{
 if(finished)return;
 secondsLeft=Math.max(0,Math.ceil((deadline-Date.now())/1000));
 updateTimer();
 if(secondsLeft===0)submitTest(true);
},1000);
}

startExam();

window.addEventListener("beforeunload",event=>{
 if(!finished){
  event.preventDefault();
  event.returnValue="";
 }
});
</script>
