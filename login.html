<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Nursing Medium</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8ff;color:#14213d;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;padding:32px;border-radius:20px;box-shadow:0 18px 50px #14213d18}.logo{font-size:24px;font-weight:800}.logo span{color:#095CF8}h1{margin:10px 0 6px}.sub{color:#667085;margin-bottom:24px}.tabs{display:flex;gap:4px;background:#f2f4f7;padding:4px;border-radius:10px}.tabs button{flex:1;border:0;padding:11px;border-radius:8px;background:transparent;font-weight:700;cursor:pointer}.tabs .active{background:#fff;color:#095CF8}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #d8deea;border-radius:9px;font-size:15px}button.primary{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#095CF8;color:#fff;font-weight:800;cursor:pointer}.link{border:0;background:none;color:#095CF8;font-weight:700;cursor:pointer;margin-top:14px}.msg{display:none;margin-top:15px;padding:11px;border-radius:9px;font-size:14px}.back{display:block;text-align:center;margin-top:22px;color:#667085;text-decoration:none}</style></head><body>
<div class="card"><div class="logo">Nursing <span>Medium</span></div><h1 id="title">Welcome back</h1><p class="sub" id="sub">Login to access your preparation dashboard.</p>
<div class="tabs"><button id="lt" class="active" onclick="loginMode()">Login</button><button id="st" onclick="signupMode()">Create Account</button></div>
<form onsubmit="auth(event)"><div id="nw" style="display:none"><label>Full Name</label><input id="name" type="text"></div><label>Email Address</label><input id="email" type="email" required><label>Password</label><input id="pass" type="password" minlength="6" required><div id="cw" style="display:none"><label>Confirm Password</label><input id="confirm" type="password" minlength="6"></div><button class="primary" id="submit">Login</button></form>
<div style="text-align:center"><button class="link" id="forgot" onclick="forgot()">Forgot password?</button></div><div id="msg" class="msg"></div><a class="back" href="/">← Back to Nursing Medium</a></div>
<script>
const sb=supabase.createClient("https://yctpbctqsvdjcrrovocs.supabase.co","sb_publishable_HC09xf-cQ7yLa8wzJQjPTg_4pVGHoks");let mode="login";
function msg(t,c){let x=document.getElementById("msg");x.textContent=t;x.style.display="block";x.style.background=c==="e"?"#fff1f2":"#ecfdf3";x.style.color=c==="e"?"#b42318":"#067647"}
function loginMode(){mode="login";lt.classList.add("active");st.classList.remove("active");nw.style.display="none";cw.style.display="none";forgot.style.display="inline-block";submit.textContent="Login";title.textContent="Welcome back";sub.textContent="Login to access your preparation dashboard."}
function signupMode(){mode="signup";st.classList.add("active");lt.classList.remove("active");nw.style.display="block";cw.style.display="block";forgot.style.display="none";submit.textContent="Create Account";title.textContent="Create your account";sub.textContent="Create a Nursing Medium account."}
async function auth(e){e.preventDefault();try{if(mode==="signup"){if(pass.value!==confirm.value)throw Error("Passwords do not match.");let r=await sb.auth.signUp({email:email.value.trim(),password:pass.value,options:{data:{full_name:name.value.trim()},emailRedirectTo:location.origin+"/dashboard.html"}});if(r.error)throw r.error;msg("Account created. Please check your email and confirm your email address.");}else{let r=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)throw r.error;location.href="/dashboard.html"}}catch(e){msg(e.message,"e")}}
async function forgot(){if(!email.value.trim())return msg("Enter your email first.","e");let r=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+"/reset-password.html"});if(r.error)msg(r.error.message,"e");else msg("Password reset link sent. Check your email.")}
</script></body></html>
