<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Login | Nursing Medium</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8ff;color:#14213d;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(440px,100%);background:#fff;padding:32px;border-radius:20px;box-shadow:0 18px 50px #14213d18}
.logo{font-size:24px;font-weight:800}.logo span{color:#095CF8}
h1{margin:10px 0 6px}.sub{color:#667085;margin-bottom:24px}
.tabs{display:flex;gap:4px;background:#f2f4f7;padding:4px;border-radius:10px}
.tabs button{flex:1;border:0;padding:11px;border-radius:8px;background:transparent;font-weight:700;cursor:pointer}
.tabs .active{background:#fff;color:#095CF8}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}
input{width:100%;padding:13px;border:1px solid #d8deea;border-radius:9px;font-size:15px}
button.primary{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#095CF8;color:#fff;font-weight:800;cursor:pointer}
.link{border:0;background:none;color:#095CF8;font-weight:700;cursor:pointer;margin-top:14px}
.msg{display:none;margin-top:15px;padding:11px;border-radius:9px;font-size:14px}
.back{display:block;text-align:center;margin-top:22px;color:#667085;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Nursing <span>Medium</span></div>

  <h1 id="pageTitle">Welcome back</h1>
  <p class="sub" id="pageSub">Login to access your preparation dashboard.</p>

  <div class="tabs">
    <button type="button" id="loginTab" class="active">Login</button>
    <button type="button" id="signupTab">Create Account</button>
  </div>

  <form id="authForm">
    <div id="nameWrap" style="display:none">
      <label for="fullName">Full Name</label>
      <input id="fullName" type="text" autocomplete="name">
    </div>

    <label for="email">Email Address</label>
    <input id="email" type="email" autocomplete="email" required>

    <label for="password">Password</label>
    <input id="password" type="password" minlength="6" autocomplete="current-password" required>

    <div id="confirmWrap" style="display:none">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password">
    </div>

    <button type="submit" class="primary" id="submitBtn">Login</button>
  </form>

  <div style="text-align:center">
    <button type="button" class="link" id="forgotBtn">Forgot password?</button>
  </div>

  <div id="message" class="msg"></div>

  <a class="back" href="/">← Back to Nursing Medium</a>
</div>

<script>
const SUPABASE_URL = "https://yctpbctqsvdjcrrovocs.supabase.co";
const SUPABASE_KEY = "sb_publishable_HC09xf-cQ7yLa8wzJQjPTg_4pVGHoks";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let mode = "login";

const pageTitle = document.getElementById("pageTitle");
const pageSub = document.getElementById("pageSub");
const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const nameWrap = document.getElementById("nameWrap");
const confirmWrap = document.getElementById("confirmWrap");
const fullName = document.getElementById("fullName");
const email = document.getElementById("email");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const submitBtn = document.getElementById("submitBtn");
const forgotBtn = document.getElementById("forgotBtn");
const message = document.getElementById("message");
const authForm = document.getElementById("authForm");

function clearMessage(){
  message.textContent = "";
  message.style.display = "none";
}

function showMessage(text, error=false){
  message.textContent = text;
  message.style.display = "block";
  message.style.background = error ? "#fff1f2" : "#ecfdf3";
  message.style.color = error ? "#b42318" : "#067647";
}

function setLoginMode(){
  mode = "login";
  loginTab.classList.add("active");
  signupTab.classList.remove("active");
  nameWrap.style.display = "none";
  confirmWrap.style.display = "none";
  forgotBtn.style.display = "inline-block";
  submitBtn.textContent = "Login";
  pageTitle.textContent = "Welcome back";
  pageSub.textContent = "Login to access your preparation dashboard.";
  fullName.required = false;
  confirmPassword.required = false;
  password.autocomplete = "current-password";
  clearMessage();
}

function setSignupMode(){
  mode = "signup";
  signupTab.classList.add("active");
  loginTab.classList.remove("active");
  nameWrap.style.display = "block";
  confirmWrap.style.display = "block";
  forgotBtn.style.display = "none";
  submitBtn.textContent = "Create Account";
  pageTitle.textContent = "Create your account";
  pageSub.textContent = "Create a Nursing Medium account.";
  fullName.required = true;
  confirmPassword.required = true;
  password.autocomplete = "new-password";
  clearMessage();
}

loginTab.addEventListener("click", setLoginMode);
signupTab.addEventListener("click", setSignupMode);

authForm.addEventListener("submit", async function(e){
  e.preventDefault();
  clearMessage();
  submitBtn.disabled = true;

  try{
    if(mode === "signup"){
      if(password.value !== confirmPassword.value){
        throw new Error("Passwords do not match.");
      }

      const result = await sb.auth.signUp({
        email: email.value.trim(),
        password: password.value,
        options:{
          data:{full_name: fullName.value.trim()},
          emailRedirectTo: location.origin + "/dashboard.html"
        }
      });

      if(result.error) throw result.error;

      showMessage("Account created. Please check your email and confirm your email address.");
      authForm.reset();
    }else{
      const result = await sb.auth.signInWithPassword({
        email: email.value.trim(),
        password: password.value
      });

      if(result.error) throw result.error;
      location.href = "/dashboard.html";
    }
  }catch(error){
    showMessage(error.message || "Something went wrong. Please try again.", true);
  }finally{
    submitBtn.disabled = false;
  }
});

forgotBtn.addEventListener("click", async function(){
  clearMessage();

  if(!email.value.trim()){
    showMessage("Enter your email first.", true);
    return;
  }

  const result = await sb.auth.resetPasswordForEmail(email.value.trim(), {
    redirectTo: location.origin + "/reset-password.html"
  });

  if(result.error) showMessage(result.error.message, true);
  else showMessage("Password reset link sent. Check your email.");
});

setLoginMode();
</script>
</body>
</html>
