:#b91c1c;font-weight:800}@media(max-width:800px){main{grid-template-columns:1fr}.top{gap:8px}.stem{font-size:17px}}
</style></head><body><header><div class="top"><div><b>Nursing Medium — PGIMER Nursing Officer</b><div style="font-size:12px;color:#cbd5e1;margin-top:4px">Mock Test 3 • 100 Difficult Questions • 90 Minutes</div></div><div class="timer" id="timer">90:00</div></div></header><main id="exam"><section class="card"><span class="badge" id="topic"></span><div class="qnum" id="qnum"></div><div class="bar"><i id="bar"></i></div><div id="body"></div><div class="nav"><button type="button" class="secondary" onclick="prev()">← Previous</button><button type="button" class="primary" onclick="next()">Next →</button></div></section><aside class="card"><b>Question Navigator</b><div class="grid" id="nav"></div><div style="font-size:12px;color:#64748b;margin-top:10px">Blue = answered/current</div><button type="button" class="submit" onclick="submit(false)">Submit Test</button></aside></main><section class="card result" id="result" style="display:none"><h2>Result</h2><div class="score" id="score"></div><p>Advanced mode: clinical judgment, prioritization, deterioration, safety and interpretation.</p><h3>Topic-wise Performance</h3><div id="topics"></div><h3>Answer Review</h3><div id="reviews"></div><button type="button" class="primary" onclick="location.reload()">Restart</button></section><script>const qs=[{"id": 1, "topic": "Emergency", "stem": "A trauma patient has facial fractures, gurgling respirations, SpO2 86%, HR 132. What is the priority?", "options": ["Give oral fluids.", "Prepare for immediate airway control while maintaining cervical alignment.", "Insert urinary catheter first.", "Obtain a full pain history first."], "correct": 1, "rationale": "Airway obstruction is the immediate threat."}, {"id": 2, "topic": "Emergency", "stem": "After intubation, a trauma patient becomes hypotensive with absent right breath sounds and tracheal deviation. What should the nurse anticipate?", "options": ["Pericardiocentesis.", "Routine chest radiography before intervention.", "Immediate needle/finger decompression for suspected tension pneumothorax.", "IV furosemide."], "correct": 2, "rationale": "The combination indicates obstructive shock from tension pneumothorax."}, {"id": 3, "topic": "Emergency", "stem": "A pelvic-fracture patient has BP 78/46, HR 140, cool skin and increasing abdominal girth. Which order should be questioned?", "options": ["Type and crossmatch blood.", "Large-bore IV access.", "Rapid isotonic/blood-product resuscitation as ordered.", "IM ketorolac for pain."], "correct": 3, "rationale": "NSAIDs can worsen bleeding in major hemorrhage."}, {"id": 4, "topic": "Emergency", "stem": "A patient with T5 spinal injury has BP 82/50, HR 48, warm dry skin and no obvious bleeding. Which mechanism is most likely?", "options": ["Loss of sympathetic vascular tone with neurogenic shock.", "Massive fluid loss causing hypovolemic shock.", "Severe left ventricular failure.", "Anaphylaxis from contrast."], "correct": 0, "rationale": "Neurogenic shock can cause hypotension with relative bradycardia and warm skin."}, {"id": 5, "topic": "Emergency", "stem": "A burn patient has facial burns, soot around the mouth and progressively hoarse voice. Which finding should trigger the earliest escalation?", "options": ["Mild thirst.", "Progressive hoarseness with facial/oropharyngeal burns.", "Pain score 6/10.", "Blister on the forearm."], "correct": 1, "rationale": "Airway edema can progress rapidly after inhalation injury."}, {"id": 6, "topic": "Sepsis", "stem": "A septic patient remains MAP 56 after appropriate crystalloid resuscitation. Which therapy should the nurse expect?", "options": ["Oral propranolol.", "Fluid restriction only.", "Norepinephrine infusion.", "IV furosemide."], "correct": 2, "rationale": "Persistent septic hypotension after fluids generally requires a vasopressor."}, {"id": 7, "topic": "Sepsis", "stem": "On norepinephrine, MAP rises to 72 but urine output falls to 10 mL/hr and mottling appears. What is the best response?", "options": ["Stop norepinephrine independently.", "Ignore the urine output until morning.", "Give potassium without checking a level.", "Reassess perfusion and urgently report possible worsening organ dysfunction."], "correct": 3, "rationale": "Low urine output and mottling suggest ongoing poor perfusion."}, {"id": 8, "topic": "Sepsis", "stem": "A pneumonia patient has lactate 6.0, RR 34, confusion and BP 84/48. Which interpretation is most accurate?", "options": ["Sepsis with shock and organ dysfunction requiring immediate escalation.", "Uncomplicated anxiety.", "Mild dehydration only.", "Expected fever response."], "correct": 0, "rationale": "Hypotension, altered mentation and high lactate indicate severe systemic hypoperfusion."}, {"id": 9, "topic": "Sepsis", "stem": "A central-line patient suddenly develops dyspnea during line manipulation and air is visible in the tubing. What should the nurse do first?", "options": ["Ask the patient to walk.", "Clamp the line, give oxygen and position/support the patient for suspected air embolism.", "Flush the line rapidly.", "Remove the line immediately without preparation."], "correct": 1, "rationale": "Prevent more air entry and support oxygenation immediately."}, {"id": 10, "topic": "Sepsis", "stem": "Which trend best supports successful resuscitation of septic shock?", "options": ["Urine output falls progressively.", "Mottling becomes more extensive.", "Lactate falls, urine output improves and mentation clears.", "MAP falls with increasing vasopressor dose."], "correct": 2, "rationale": "Improving perfusion should produce improving organ-function markers."}, {"id": 11, "topic": "Cardiac", "stem": "A patient with chest pain has BP 86/52 and diaphoresis. Which prescribed medication should the nurse question?", "options": ["Aspirin.", "Continuous ECG monitoring.", "Oxygen if hypoxemic.", "Sublingual nitroglycerin."], "correct": 3, "rationale": "Nitroglycerin can worsen hypotension by reducing preload."}, {"id": 12, "topic": "Cardiac", "stem": "Six hours after MI, a patient develops pink frothy sputum, severe dyspnea and crackles. What is the priority position?", "options": ["High-Fowler position while emergency treatment is initiated.", "Flat supine.", "Trendelenburg.", "Prone."], "correct": 0, "rationale": "Upright positioning improves ventilation and reduces venous return."}, {"id": 13, "topic": "Cardiac", "stem": "A patient on digoxin has HR 48, nausea and yellow-green halos. What should the nurse do?", "options": ["Encourage strenuous exercise.", "Hold digoxin and notify the provider; anticipate level/electrolyte assessment.", "Give the scheduled dose with food.", "Give an extra dose."], "correct": 1, "rationale": "Bradycardia, GI symptoms and visual changes suggest digoxin toxicity."}, {"id": 14, "topic": "Cardiac", "stem": "A patient with heart failure receives IV furosemide. Which new finding is most urgent?", "options": ["Reduced ankle edema.", "Urine output 80 mL/hr.", "K+ 2.7 mEq/L with ventricular ectopy.", "Weight loss of 1 kg."], "correct": 2, "rationale": "Severe hypokalemia with ectopy can cause life-threatening dysrhythmia."}, {"id": 15, "topic": "Cardiac", "stem": "A patient on heparin for ACS develops sudden severe headache and vomiting. What is the priority?", "options": ["Give another heparin bolus.", "Give IM ketorolac.", "Encourage ambulation.", "Stop/hold anticoagulation per protocol and urgently evaluate for intracranial bleeding."], "correct": 3, "rationale": "New neurological symptoms during anticoagulation are a bleeding emergency."}, {"id": 16, "topic": "Respiratory", "stem": "A COPD patient becomes drowsy. ABG: pH 7.25, PaCO2 72, HCO3 31. Which escalation is most appropriate?", "options": ["Support ventilation and prepare for noninvasive/invasive ventilatory support as indicated.", "Give a sedative.", "Rapidly give bicarbonate as the only treatment.", "Stop all oxygen immediately."], "correct": 0, "rationale": "Acute-on-chronic hypercapnic respiratory failure requires ventilatory support."}, {"id": 17, "topic": "Respiratory", "stem": "A severe asthma patient becomes exhausted with minimal wheezing and SpO2 82%. What does this suggest?", "options": ["Resolved asthma.", "Critical airflow limitation with impending respiratory failure.", "Improvement in bronchospasm.", "Mild anxiety."], "correct": 1, "rationale": "A silent chest in a deteriorating asthmatic is a late ominous sign."}, {"id": 18, "topic": "Respiratory", "stem": "A ventilated patient has a high-pressure alarm, coarse secretions and reduced air movement. What should the nurse do first?", "options": ["Disconnect the ventilator permanently.", "Give oral medication.", "Assess the airway and suction if indicated.", "Increase tidal volume immediately."], "correct": 2, "rationale": "Secretions can obstruct the airway and cause high-pressure alarms."}, {"id": 19, "topic": "Respiratory", "stem": "A patient suddenly develops pleuritic chest pain, HR 132 and SpO2 84% after hip surgery. Which priority action is appropriate?", "options": ["Massage the calf.", "Encourage vigorous ambulation.", "Give oral fluids only.", "Apply oxygen and activate urgent evaluation for pulmonary embolism."], "correct": 3, "rationale": "The presentation is highly suspicious for PE."}, {"id": 20, "topic": "Respiratory", "stem": "A chest-tube patient has continuous bubbling in the water-seal chamber after a dressing change. What should the nurse do first?", "options": ["Check the tubing, connections and insertion site for an air leak.", "Clamp the tube for 30 minutes.", "Strip the tube vigorously.", "Remove the drainage system."], "correct": 0, "rationale": "Continuous bubbling suggests an air leak that should be localized."}, {"id": 21, "topic": "Neurology", "stem": "A stroke patient 4 hours after onset develops worsening headache, vomiting and declining consciousness. What complication is most concerning?", "options": ["Mild dehydration.", "Rising intracranial pressure/possible intracranial hemorrhage.", "Constipation.", "Urinary retention."], "correct": 1, "rationale": "Neurological deterioration with headache/vomiting is an emergency."}, {"id": 22, "topic": "Neurology", "stem": "A patient arrives 40 minutes after sudden unilateral weakness. Before oral medication, which assessment is essential?", "options": ["Skin turgor.", "Visual acuity only.", "Swallowing/aspiration risk assessment.", "Bowel sounds."], "correct": 2, "rationale": "Acute stroke commonly impairs swallowing and increases aspiration risk."}, {"id": 23, "topic": "Neurology", "stem": "After thrombolytic therapy, a patient develops sudden severe headache and new weakness. What should the nurse do?", "options": ["Continue infusion.", "Give IM aspirin.", "Ambulate the patient.", "Stop/hold thrombolytic therapy as applicable and urgently evaluate for intracranial hemorrhage."], "correct": 3, "rationale": "Sudden neurological deterioration after thrombolysis is a bleeding emergency."}, {"id": 24, "topic": "Neurology", "stem": "A patient with increased ICP is being repositioned. Which action should be avoided?", "options": ["Marked hip flexion and neck rotation.", "Neutral neck alignment.", "Head elevation as ordered.", "Reducing unnecessary stimulation."], "correct": 0, "rationale": "Flexion and rotation can impede venous drainage and raise ICP."}, {"id": 25, "topic": "Neurology", "stem": "A T6 injury patient develops BP 208/108, flushing and severe headache. What is the first action?", "options": ["Encourage bearing down.", "Sit upright and identify/remove the triggering stimulus.", "Lay flat.", "Give a large fluid bolus."], "correct": 1, "rationale": "This is autonomic dysreflexia; immediate positioning and trigger removal are priorities."}, {"id": 26, "topic": "Endocrine", "stem": "A DKA patient has glucose 430, pH 7.18 and K+ 3.0. Which order should the nurse question?", "options": ["Cardiac monitoring.", "Frequent electrolyte checks.", "Starting IV insulin immediately before addressing severe hypokalemia.", "Isotonic IV fluids."], "correct": 2, "rationale": "Insulin can shift potassium intracellularly and worsen dangerous hypokalemia."}, {"id": 27, "topic": "Endocrine", "stem": "During DKA treatment glucose falls to 190 but the anion gap remains elevated. What is the correct principle?", "options": ["Stop insulin permanently.", "Stop IV fluids.", "Give free water only.", "Continue insulin to clear ketosis and add dextrose as needed."], "correct": 3, "rationale": "Glucose can normalize before ketoacidosis resolves."}, {"id": 28, "topic": "Endocrine", "stem": "A patient with Na+ 118 becomes confused and has a generalized seizure. Which action is priority?", "options": ["Protect the airway and initiate emergency treatment of severe symptomatic hyponatremia.", "Give free water.", "Encourage oral fluids.", "Delay treatment for repeat labs tomorrow."], "correct": 0, "rationale": "Seizure with severe hyponatremia is an emergency."}, {"id": 29, "topic": "Renal", "stem": "A patient with AKI has K+ 6.8 and peaked T waves. Which drug should be given first to stabilize cardiac membranes?", "options": ["Routine multivitamin.", "IV calcium gluconate.", "Oral potassium.", "Dextrose-free water."], "correct": 1, "rationale": "Calcium rapidly stabilizes the myocardium while definitive potassium-lowering therapy is given."}, {"id": 30, "topic": "Renal", "stem": "During CRRT, the patient becomes hypotensive and the machine alarms for access pressure. What should the nurse assess first?", "options": ["Give an oral antihypertensive.", "Ignore the alarm.", "Vascular access and circuit for kinking, obstruction or disconnection.", "Increase ultrafiltration."], "correct": 2, "rationale": "Access/circuit problems can interrupt therapy and contribute to instability."}, {"id": 31, "topic": "Pharmacology", "stem": "During a vancomycin infusion, a patient develops flushing and itching but no wheeze or hypotension. What is the most likely explanation?", "options": ["Digoxin toxicity.", "Hypoglycemia.", "Neurogenic shock.", "Infusion-related vancomycin reaction from rapid administration."], "correct": 3, "rationale": "Rapid vancomycin infusion can cause flushing/pruritus without true anaphylaxis."}, {"id": 32, "topic": "Pharmacology", "stem": "A lithium-treated patient has diarrhea, coarse tremor, ataxia and slurred speech. What is the priority?", "options": ["Hold lithium and urgently assess level, renal function and hydration.", "Give the next dose.", "Encourage a low-sodium diet.", "Add another serotonergic drug."], "correct": 0, "rationale": "These are significant lithium-toxicity features."}, {"id": 33, "topic": "Pharmacology", "stem": "A warfarin patient has INR 8.2 and active GI bleeding. What should the nurse anticipate?", "options": ["IM ketorolac.", "Urgent anticoagulation reversal with appropriate vitamin K and factor replacement.", "More warfarin.", "Aspirin."], "correct": 1, "rationale": "Major bleeding with very high INR requires urgent reversal."}, {"id": 34, "topic": "Pharmacology", "stem": "A patient receiving magnesium sulfate has RR 8, absent reflexes and urine output 15 mL/hr. Which medication should be available?", "options": ["Naloxone.", "Flumazenil.", "Calcium gluconate.", "Protamine."], "correct": 2, "rationale": "Calcium antagonizes magnesium toxicity."}, {"id": 35, "topic": "Pharmacology", "stem": "A patient on IV insulin has K+ 2.8 and ventricular ectopy. What is the most urgent concern?", "options": ["Hypercalcemia.", "Constipation.", "Hypernatremia.", "Life-threatening worsening hypokalemia."], "correct": 3, "rationale": "Insulin shifts potassium intracellularly and may worsen dysrhythmia risk."}, {"id": 36, "topic": "OBG", "stem": "Thirty minutes postpartum, a woman has heavy bleeding and a boggy uterus displaced to the right. What should the nurse do first?", "options": ["Massage the fundus and address bladder distension.", "Encourage ambulation.", "Apply an ice pack only.", "Delay intervention until the next vital signs."], "correct": 0, "rationale": "Uterine atony is worsened by bladder distension and requires immediate intervention."}, {"id": 37, "topic": "OBG", "stem": "A patient with severe preeclampsia has BP 176/114, severe headache and epigastric pain. Which concern is highest?", "options": ["Routine postpartum pain.", "Impending maternal seizure/stroke from severe hypertension.", "Normal pregnancy discomfort.", "Mild dehydration."], "correct": 1, "rationale": "Severe hypertension plus neurological/epigastric symptoms indicates severe disease."}, {"id": 38, "topic": "OBG", "stem": "During magnesium therapy, a patient becomes somnolent with RR 9 and absent reflexes. What is the priority?", "options": ["Give oral calcium later.", "Encourage walking.", "Stop magnesium and prepare calcium gluconate while supporting breathing.", "Increase magnesium."], "correct": 2, "rationale": "These findings indicate magnesium toxicity."}, {"id": 39, "topic": "OBG", "stem": "Oxytocin is running. Contractions occur every 90 seconds for 100 seconds and recurrent fetal decelerations appear. What should the nurse do first?", "options": ["Increase oxytocin.", "Encourage pushing.", "Continue unchanged.", "Stop oxytocin and initiate intrauterine resuscitation."], "correct": 3, "rationale": "Tachysystole can reduce uteroplacental perfusion; stop the uterotonic."}, {"id": 40, "topic": "OBG", "stem": "A postpartum patient develops sudden dyspnea, pleuritic pain and tachycardia. What is the priority concern?", "options": ["Pulmonary embolism.", "Breast engorgement.", "Normal postpartum fatigue.", "Constipation."], "correct": 0, "rationale": "The symptom cluster is concerning for venous thromboembolism."}, {"id": 41, "topic": "Pediatrics", "stem": "A child with asthma becomes lethargic with poor air entry and SpO2 81%. What is most concerning?", "options": ["Simple anxiety.", "Impending respiratory failure.", "Mild wheezing.", "Normal response to bronchodilator."], "correct": 1, "rationale": "Lethargy and poor air movement are late signs of severe obstruction."}, {"id": 42, "topic": "Pediatrics", "stem": "A child with suspected epiglottitis is drooling, tripod-positioned and stridulous. Which action should be avoided?", "options": ["Preparing airway equipment.", "Providing oxygen as tolerated.", "Inspecting the throat with a tongue depressor.", "Keeping the child calm."], "correct": 2, "rationale": "Throat manipulation can precipitate complete airway obstruction."}, {"id": 43, "topic": "Pediatrics", "stem": "An infant with bronchiolitis has RR 70, nasal flaring and poor feeding. Which assessment is most urgent?", "options": ["Potty-training history.", "Vision screening.", "Diet preference.", "Work of breathing and oxygenation."], "correct": 3, "rationale": "Respiratory fatigue and hypoxemia are the immediate risks."}, {"id": 44, "topic": "Pediatrics", "stem": "A child with gastroenteritis is lethargic with weak pulses and delayed capillary refill. What is the priority?", "options": ["Rapid isotonic fluid resuscitation as prescribed.", "Antidiarrheal medication.", "Unrestricted juice only.", "Waiting for stool culture."], "correct": 0, "rationale": "Shock signs require prompt circulatory support."}, {"id": 45, "topic": "Pediatrics", "stem": "A chemotherapy patient has fever 38.5 C and ANC 400/mm3. What is the priority?", "options": ["Allow exposure to visitors with respiratory illness.", "Treat as febrile neutropenia and initiate urgent infection management.", "Wait 24 hours.", "Give a live vaccine."], "correct": 1, "rationale": "Febrile neutropenia is an oncologic emergency."}, {"id": 46, "topic": "Infection", "stem": "A patient with suspected measles arrives in the ED. Which room is appropriate?", "options": ["Shared ward room.", "Curtained four-bed room.", "Airborne infection isolation room.", "Positive-pressure room."], "correct": 2, "rationale": "Measles requires airborne precautions."}, {"id": 47, "topic": "Infection", "stem": "A nurse sustains a needlestick from a patient with unknown HIV status. What is the first action?", "options": ["Apply bleach to the wound.", "Wait for symptoms.", "Squeeze aggressively for several minutes.", "Wash the site promptly and initiate occupational exposure evaluation."], "correct": 3, "rationale": "Immediate cleansing and prompt exposure assessment are essential."}, {"id": 48, "topic": "Infection", "stem": "A patient has suspected C. difficile infection. Which practice is essential?", "options": ["Contact precautions and soap-and-water hand hygiene.", "Alcohol rub alone.", "Airborne isolation.", "Shared equipment without cleaning."], "correct": 0, "rationale": "C. difficile spores require contact precautions and soap-and-water hand hygiene."}, {"id": 49, "topic": "Infection", "stem": "A patient with pulmonary TB must leave the room for an essential procedure. Which is appropriate?", "options": ["Patient wears N95 while staff use no protection.", "Patient wears a surgical mask and staff use appropriate respiratory protection.", "No precautions.", "Gloves only."], "correct": 1, "rationale": "Transport should minimize airborne exposure."}, {"id": 50, "topic": "Infection", "stem": "A central-line patient develops fever and rigors during infusion. What should the nurse do first?", "options": ["Ignore fever if BP is normal.", "Remove the line without assessment.", "Stop the infusion and assess the patient while initiating the prescribed infection workup.", "Flush rapidly with the same solution."], "correct": 2, "rationale": "Rigors during infusion can signal bloodstream infection or another acute reaction."}, {"id": 51, "topic": "Delegation", "stem": "Which task is appropriate for an experienced nursing assistant?", "options": ["Initial assessment of chest pain.", "Teaching insulin self-injection.", "Evaluating IV opioid response.", "Ambulate a stable postoperative patient after RN assessment."], "correct": 3, "rationale": "Assessment, teaching and evaluation remain RN responsibilities."}, {"id": 52, "topic": "Delegation", "stem": "Which patient should the RN assess first?", "options": ["A postoperative patient with new bright-red drainage and HR 126.", "A patient waiting for routine discharge papers.", "A patient requesting a blanket.", "A patient awaiting routine dressing change."], "correct": 0, "rationale": "New bleeding with tachycardia suggests acute deterioration."}, {"id": 53, "topic": "Delegation", "stem": "Which assignment is appropriate for an LPN/LVN caring for stable patients?", "options": ["Provide initial chemotherapy teaching.", "Administer routine oral medications to a stable patient with predictable needs.", "Titrate a vasopressor.", "Perform initial septic-shock assessment."], "correct": 1, "rationale": "Stable predictable care can be assigned within scope; unstable assessment/titration requires RN-level judgment."}, {"id": 54, "topic": "Safety", "stem": "A nurse realizes a high-alert insulin dose may have been wrong. What is the priority?", "options": ["Wait for the next glucose check.", "Alter the medication record.", "Assess the patient immediately and follow medication-error reporting procedures.", "Hide the error if asymptomatic."], "correct": 2, "rationale": "Patient assessment and transparent safety reporting are essential."}, {"id": 55, "topic": "Safety", "stem": "During handoff the outgoing nurse says, “He is fine.” Which response is safest?", "options": ["Accept the statement.", "Skip handoff because the patient is stable.", "Ask only about medications.", "Request current objective assessment, trends, treatments and pending concerns."], "correct": 3, "rationale": "Safe handoff requires specific, current information."}, {"id": 56, "topic": "Med-Surg", "stem": "A GI-bleed patient has BP 88/52, HR 128, cool skin and dizziness. Which action has priority?", "options": ["Establish/maintain large-bore IV access and prepare for rapid resuscitation.", "Give oral iron.", "Give a laxative.", "Encourage ambulation."], "correct": 0, "rationale": "The patient has signs of hemorrhagic shock."}, {"id": 57, "topic": "Med-Surg", "stem": "A patient with pancreatitis develops increasing abdominal distension, tachycardia and SpO2 87%. What is the priority concern?", "options": ["Normal recovery.", "Systemic inflammatory deterioration with respiratory compromise.", "Improved pancreatic function.", "Simple constipation only."], "correct": 1, "rationale": "Pancreatitis can trigger severe systemic complications including respiratory failure."}, {"id": 58, "topic": "Med-Surg", "stem": "Twelve hours after abdominal surgery, a patient has severe pain, rigid abdomen, fever and tachycardia. What is the best action?", "options": ["Apply a heating pad.", "Encourage vigorous ambulation.", "Urgently notify the surgical team for a possible intra-abdominal complication.", "Give oral food."], "correct": 2, "rationale": "Rigid abdomen with systemic deterioration suggests a serious postoperative complication."}, {"id": 59, "topic": "Med-Surg", "stem": "A cirrhosis patient becomes confused and has asterixis. Which treatment should the nurse expect?", "options": ["High-dose opioid therapy.", "Routine sedative infusion.", "Unrestricted protein supplements immediately.", "Lactulose with monitoring of mental status and bowel pattern."], "correct": 3, "rationale": "Lactulose reduces intestinal ammonia absorption and is used for hepatic encephalopathy."}, {"id": 60, "topic": "Med-Surg", "stem": "A new colostomy appears dusky purple and cool. What should the nurse do?", "options": ["Notify the surgical team promptly for possible stoma ischemia.", "Document it as normal.", "Apply ice directly.", "Irrigate forcefully."], "correct": 0, "rationale": "A cool dusky stoma may have compromised blood supply."}, {"id": 61, "topic": "Mental Health", "stem": "A manic patient has slept 2 hours in 3 days and is increasingly intrusive. Which intervention is best?", "options": ["Challenge every grandiose statement.", "Reduce stimulation and set clear, consistent limits.", "Allow unlimited activity.", "Use lengthy group discussions."], "correct": 1, "rationale": "Low stimulation and consistent boundaries reduce escalation and exhaustion."}, {"id": 62, "topic": "Mental Health", "stem": "A patient says, “I will kill myself tonight; I have the tablets with me.” What is the priority?", "options": ["Leave the patient alone.", "Discharge after a verbal promise.", "Maintain immediate safety with continuous/close observation and remove access to means.", "Promise confidentiality."], "correct": 2, "rationale": "A specific plan plus access to means is an immediate safety emergency."}, {"id": 63, "topic": "Mental Health", "stem": "A patient on an antipsychotic develops fever, severe rigidity, confusion and autonomic instability. What is suspected?", "options": ["Tardive dyskinesia.", "Simple anxiety.", "Mild akathisia.", "Neuroleptic malignant syndrome."], "correct": 3, "rationale": "Fever, rigidity and autonomic instability are classic NMS features."}, {"id": 64, "topic": "Mental Health", "stem": "A patient taking an SSRI and linezolid develops agitation, diaphoresis, hyperreflexia and clonus. What is the priority concern?", "options": ["Serotonin syndrome.", "Lithium toxicity.", "Neurogenic shock.", "Tardive dyskinesia."], "correct": 0, "rationale": "Serotonergic excess commonly causes clonus and hyperreflexia with autonomic symptoms."}, {"id": 65, "topic": "Mental Health", "stem": "A patient in alcohol withdrawal becomes disoriented, severely tremulous, hypertensive and hallucinates. What is the priority?", "options": ["Assume chronic psychosis.", "Urgent treatment for severe withdrawal with seizure/autonomic monitoring.", "Place in a noisy common room.", "Withhold fluids."], "correct": 1, "rationale": "Delirium tremens can be life-threatening."}, {"id": 66, "topic": "Nutrition", "stem": "During tube feeding a patient coughs, desaturates and develops coarse crackles. What should the nurse do first?", "options": ["Flush more formula.", "Place the patient flat.", "Stop the feeding and assess airway and breathing.", "Increase the feeding rate."], "correct": 2, "rationale": "The findings suggest aspiration."}, {"id": 67, "topic": "Nutrition", "stem": "A patient has Na+ 121 with confusion after excessive water intake. Which order should be questioned?", "options": ["Restrict fluid as prescribed.", "Perform frequent neurological checks.", "Monitor sodium closely.", "Administer large volumes of free water."], "correct": 3, "rationale": "Free water would worsen dilutional hyponatremia."}, {"id": 68, "topic": "Nutrition", "stem": "A TPN infusion is abruptly stopped because the central line is occluded. What complication is most immediate?", "options": ["Hypoglycemia.", "Hypercalcemia.", "Hypermagnesemia.", "Hypernatremia."], "correct": 0, "rationale": "Abrupt withdrawal of concentrated dextrose can cause rebound hypoglycemia."}, {"id": 69, "topic": "Nutrition", "stem": "A malnourished patient develops weakness and ventricular ectopy after nutrition is started; phosphate is 1.1 mg/dL. What is suspected?", "options": ["Acute gout.", "Refeeding syndrome.", "Diabetes insipidus.", "Hyperthyroidism."], "correct": 1, "rationale": "Rapid nutrition can cause profound phosphate shifts and cardiac complications."}, {"id": 70, "topic": "Nutrition", "stem": "A patient with persistent vomiting has pH 7.51 and HCO3 34. What is the acid-base disorder?", "options": ["Metabolic acidosis.", "Respiratory alkalosis.", "Metabolic alkalosis.", "Respiratory acidosis."], "correct": 2, "rationale": "Loss of gastric acid produces metabolic alkalosis."}, {"id": 71, "topic": "Perioperative", "stem": "Two hours after surgery, a patient becomes restless, RR 31 and SpO2 87%. What should the nurse assess first?", "options": ["Incision appearance only.", "Bowel sounds only.", "Discharge readiness.", "Airway and breathing."], "correct": 3, "rationale": "Restlessness may be an early sign of hypoxemia."}, {"id": 72, "topic": "Perioperative", "stem": "A postoperative patient receiving opioids has RR 7, pinpoint pupils and is difficult to arouse. Which medication should be prepared?", "options": ["Naloxone.", "Flumazenil.", "Protamine.", "Vitamin K."], "correct": 0, "rationale": "Naloxone reverses opioid-induced respiratory depression."}, {"id": 73, "topic": "Perioperative", "stem": "On postoperative day 3, a patient develops unilateral calf swelling and pain. What should the nurse do?", "options": ["Apply deep pressure.", "Avoid massage and urgently evaluate for DVT.", "Massage the calf.", "Encourage vigorous walking immediately."], "correct": 1, "rationale": "Manipulation may dislodge a thrombus."}, {"id": 74, "topic": "Perioperative", "stem": "After neck surgery, a patient develops neck swelling, hoarseness and stridor. What is the priority?", "options": ["Place flat and observe.", "Wait for the next round.", "Activate emergency airway support and notify the surgical team immediately.", "Offer oral fluids."], "correct": 2, "rationale": "Expanding neck hematoma can rapidly obstruct the airway."}, {"id": 75, "topic": "Perioperative", "stem": "A postoperative urinary catheter has produced no urine for 3 hours. What should the nurse assess first?", "options": ["Remove the catheter immediately.", "Give a diuretic without assessment.", "Ignore it until morning.", "Tubing for kinks/obstruction and the patient’s perfusion/volume status."], "correct": 3, "rationale": "Check mechanical obstruction and systemic causes before treatment."}, {"id": 76, "topic": "ECG/Visual", "stem": "The ECG shows a regular narrow-complex tachycardia near 180/min; the patient is hypotensive and confused. What is the priority?", "options": ["Synchronized cardioversion for unstable tachycardia.", "Oral beta blocker tomorrow.", "Defibrillation without synchronization.", "Vagal maneuvers only."], "correct": 0, "rationale": "Hemodynamic instability makes synchronized cardioversion the priority."}, {"id": 77, "topic": "ECG/Visual", "stem": "The ECG shows an irregularly irregular narrow-complex rhythm with no consistent P waves. Which rhythm is most likely?", "options": ["Sinus bradycardia.", "Atrial fibrillation.", "Ventricular fibrillation.", "Complete heart block."], "correct": 1, "rationale": "Irregularly irregular rhythm without organized P waves is AF."}, {"id": 78, "topic": "ECG/Visual", "stem": "A monitor shows a wide-complex rhythm and the patient is pulseless. What should the nurse do?", "options": ["Give oral amiodarone.", "Wait for another rhythm check in 10 minutes.", "Begin CPR and defibrillate as indicated by the arrest algorithm.", "Synchronized cardioversion only."], "correct": 2, "rationale": "Pulseless VT is a shockable cardiac-arrest rhythm."}, {"id": 79, "topic": "Medication Label", "stem": "A label reads Regular Insulin U-100, 100 units/mL. The order is 6 units SC. Which device is safest?", "options": ["A standard 10-mL syringe.", "An uncalibrated tuberculin syringe.", "An IV catheter.", "A U-100 insulin syringe."], "correct": 3, "rationale": "The insulin syringe is calibrated to U-100 dosing and reduces conversion errors."}, {"id": 80, "topic": "OBG/Visual", "stem": "A fetal monitor shows recurrent late decelerations with minimal variability while oxytocin is infusing. What should the nurse do first?", "options": ["Stop oxytocin and initiate intrauterine resuscitation measures.", "Increase oxytocin.", "Encourage pushing.", "Continue the infusion unchanged."], "correct": 0, "rationale": "Late decelerations with minimal variability indicate compromised fetal oxygenation."}, {"id": 81, "topic": "Emergency", "stem": "A patient with anaphylaxis after antibiotic administration has stridor and BP 74/40. Which medication is the priority?", "options": ["IV insulin.", "IM epinephrine.", "IV furosemide.", "Oral antihistamine alone."], "correct": 1, "rationale": "Epinephrine is first-line for anaphylaxis with airway/circulatory compromise."}, {"id": 82, "topic": "Emergency", "stem": "A patient with massive GI bleeding becomes confused; BP 70/40 and HR 138. Which assessment finding best indicates worsening shock?", "options": ["Improved mentation.", "Urine output 60 mL/hr.", "Urine output falls to 10 mL/hr.", "Warm dry skin."], "correct": 2, "rationale": "Oliguria reflects renal hypoperfusion and worsening shock."}, {"id": 83, "topic": "Sepsis", "stem": "A septic patient has MAP 62 despite vasopressor therapy and develops new mottling. Which additional finding is most concerning for organ dysfunction?", "options": ["Temperature 37.8 C.", "Mild thirst.", "Appetite improves.", "Creatinine rises rapidly with oliguria."], "correct": 3, "rationale": "Acute kidney injury is a major marker of organ dysfunction."}, {"id": 84, "topic": "Cardiac", "stem": "A patient with complete heart block is hypotensive and confused with HR 32. Which intervention should be anticipated?", "options": ["Immediate pacing support.", "Routine oral metoprolol.", "Ambulation.", "Fluid restriction."], "correct": 0, "rationale": "Symptomatic complete heart block requires urgent pacing."}, {"id": 85, "topic": "Respiratory", "stem": "A patient on BiPAP becomes increasingly somnolent and cannot protect the airway. What should the nurse anticipate?", "options": ["Oral fluids.", "Endotracheal intubation and invasive ventilation.", "Increasing sedatives.", "Removing all monitoring."], "correct": 1, "rationale": "Failure to protect the airway is a contraindication to relying on noninvasive support."}, {"id": 86, "topic": "Neurology", "stem": "A patient with head injury has unilateral fixed dilated pupil and declining consciousness. What should the nurse suspect?", "options": ["Mild dehydration.", "Normal post-trauma fatigue.", "Impending cerebral herniation.", "Simple migraine."], "correct": 2, "rationale": "A fixed dilated pupil with deterioration is a critical herniation sign."}, {"id": 87, "topic": "Renal", "stem": "A patient with AKI has crackles, severe edema and SpO2 86% after receiving fluids. Which action is most appropriate?", "options": ["Give another large fluid bolus.", "Encourage oral fluids.", "Place flat.", "Stop/reassess fluid administration and escalate for fluid-overload management."], "correct": 3, "rationale": "Pulmonary edema suggests fluid overload in renal failure."}, {"id": 88, "topic": "Pharmacology", "stem": "A patient receiving IV potassium reports burning at the IV site and the area is cool/swollen. What should the nurse do?", "options": ["Stop the infusion and assess for infiltration/extravasation.", "Increase the infusion rate.", "Apply pressure and continue.", "Ignore because potassium commonly burns."], "correct": 0, "rationale": "Pain, swelling and coolness suggest infiltration; potassium is vesicant/irritating and requires prompt action."}, {"id": 89, "topic": "OBG", "stem": "A laboring patient suddenly develops painless bright-red vaginal bleeding and fetal bradycardia. Which complication is most concerning?", "options": ["Hyperemesis.", "Placenta previa with acute fetal compromise.", "Normal bloody show.", "Uterine atony."], "correct": 1, "rationale": "Painless bright-red bleeding in late pregnancy suggests placenta previa; fetal bradycardia signals compromise."}, {"id": 90, "topic": "Pediatrics", "stem": "A child with diabetic ketoacidosis develops headache, bradycardia and decreasing consciousness during treatment. What complication should be suspected?", "options": ["Improving acidosis.", "Otitis media.", "Cerebral edema.", "Simple dehydration."], "correct": 2, "rationale": "Neurological deterioration during pediatric DKA treatment raises concern for cerebral edema."}, {"id": 91, "topic": "Infection", "stem": "A patient with suspected meningococcal meningitis arrives unstable. Which isolation is appropriate initially?", "options": ["Airborne only.", "Protective isolation only.", "No precautions.", "Droplet precautions."], "correct": 3, "rationale": "Meningococcal disease requires droplet precautions initially."}, {"id": 92, "topic": "Delegation", "stem": "Which task should the RN NOT delegate to an LPN/LVN?", "options": ["Initial assessment of a newly admitted patient with chest pain.", "Routine oral medication for a stable patient.", "Routine dressing change for a stable wound.", "Monitoring a stable patient after routine medication."], "correct": 0, "rationale": "Initial assessment requires RN clinical judgment."}, {"id": 93, "topic": "Med-Surg", "stem": "A patient with bowel obstruction has increasing distension, continuous pain, fever and tachycardia. Which complication should the nurse suspect?", "options": ["Improving obstruction.", "Ischemia/perforation with peritonitis.", "Simple hunger.", "Routine gas only."], "correct": 1, "rationale": "Continuous pain plus systemic signs suggests strangulation, ischemia or perforation."}, {"id": 94, "topic": "Med-Surg", "stem": "A cirrhosis patient suddenly vomits a large amount of blood and becomes hypotensive. Which action is priority?", "options": ["Routine laxative.", "Ambulation.", "Airway protection and rapid resuscitation while preparing for urgent endoscopic management.", "Oral fluids."], "correct": 2, "rationale": "Massive variceal/upper GI bleeding threatens both airway and circulation."}, {"id": 95, "topic": "Mental Health", "stem": "A patient receiving clozapine reports fever and sore throat. Which laboratory result is most important?", "options": ["Serum amylase.", "Troponin only.", "Calcium only.", "Absolute neutrophil count."], "correct": 3, "rationale": "Clozapine can cause severe neutropenia/agranulocytosis."}, {"id": 96, "topic": "Nutrition", "stem": "A patient with severe hypophosphatemia becomes weak and develops respiratory muscle failure after starting feeds. What is the likely mechanism?", "options": ["Intracellular electrolyte shifts from refeeding.", "Excess sodium intake.", "Hypercalcemia.", "Iron deficiency alone."], "correct": 0, "rationale": "Refeeding drives phosphate intracellularly, impairing ATP production and muscle function.", "visual": "CLINICAL VISUAL: Severe hypophosphatemia after starting nutrition; respiratory muscle weakness"}, {"id": 97, "topic": "Perioperative", "stem": "A postoperative patient suddenly has tachycardia, hypotension, muffled heart sounds and JVD. What complication should be suspected?", "options": ["DVT.", "Cardiac tamponade.", "Hypoglycemia.", "Simple dehydration."], "correct": 1, "rationale": "Beck-type findings suggest obstructive shock from tamponade.", "visual": "CLINICAL VISUAL: Sudden tachycardia + hypotension + JVD + muffled heart sounds"}, {"id": 98, "topic": "ECG/Visual", "stem": "An ECG shows a wide-complex tachycardia in a patient with a pulse who is hypotensive and confused. What is the immediate treatment?", "options": ["Oral medication only.", "Observation.", "Synchronized cardioversion.", "Defibrillation as if pulseless."], "correct": 2, "rationale": "Unstable VT with a pulse requires synchronized cardioversion.", "visual": "ECG VISUAL: Wide-complex tachycardia with a pulse + hypotension + confusion"}, {"id": 99, "topic": "Safety", "stem": "A nurse discovers two look-alike vials, one containing heparin and one saline, in the medication drawer. What system-level action is best?", "options": ["Rely only on memory.", "Remove all labels.", "Store them together for convenience.", "Separate/storage redesign and independent verification for high-alert medications."], "correct": 3, "rationale": "System design reduces look-alike/sound-alike medication errors.", "visual": "MEDICATION LABEL: Heparin vial and saline vial — look-alike storage safety scenario"}, {"id": 100, "topic": "Critical Care", "stem": "A ventilated patient suddenly has SpO2 78%, high peak pressure and no visible chest movement on the right. What should the nurse suspect first?", "options": ["Acute pneumothorax or tube-related obstruction/malposition requiring immediate assessment.", "Improved lung compliance.", "Routine anxiety.", "Constipation."], ect / unanswered')+'</div><div>Your answer: '+(ans[i]===null?'Not answered':String.fromCharCode(65+ans[i])+' — '+q.options[ans[i]])+'</div><div><b>Correct:</b> '+String.fromCharCode(65+q.correct)+' — '+q.options[q.correct]+'</div><div><b>Rationale:</b> '+q.rationale+'</div></div>').join('');scrollTo(0,0)}function updateTimer(){let m=Math.floor(left/60),s=left%60;E('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}updateTimer();let timer=setInterval(()=>{left--;updateTimer();if(left<=0)submit(true)},1000);render();</script></body></html>
